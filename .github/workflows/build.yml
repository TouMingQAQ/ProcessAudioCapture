name: build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # A DLL must match the bitness of the process that loads it.
          - target: x86_64-pc-windows-msvc
            arch: x64
          - target: i686-pc-windows-msvc
            arch: x86

    steps:
      - uses: actions/checkout@v4

      # rustc cannot always locate link.exe on the runner, vcvarsall makes sure
      # the MSVC toolset (link.exe, LIB, INCLUDE) is on the environment.
      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        shell: pwsh
        run: |
          $output = cargo build --release --locked --message-format short --target ${{ matrix.target }} 2>&1
          $code = $LASTEXITCODE
          $output | Write-Output
          if ($code -ne 0) {
            $errors = $output | Select-String -Pattern '^error(\[E\d+\])?:|^error(\[E\d+\])?\['
            if ($errors) {
              $errors | Select-Object -First 10 | ForEach-Object { Write-Output "::error::$($_.Line)" }
            } else {
              Write-Output "::error::cargo build failed with exit code $code"
            }
            exit 1
          }

      - name: Collect DLL
        shell: pwsh
        run: |
          $out = "target/${{ matrix.target }}/release"
          New-Item -ItemType Directory -Path dist | Out-Null
          Copy-Item -Path "$out/ProcessAudioCapture.dll" -Destination "dist/ProcessAudioCapture-${{ matrix.arch }}.dll"
          Get-ChildItem dist | Select-Object Name, Length

      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: ProcessAudioCapture-${{ matrix.target }}
          path: "dist/*.dll"
          if-no-files-found: error

  release:
    name: release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true

      # Re-running a tag would otherwise leave the assets of the previous run
      # attached to the release, so start from a clean release.
      - name: Reset release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "existing assets:"
            gh release view "$tag" --json assets --jq '.assets[].name' || true
            gh release delete "$tag" --yes --cleanup-tag=false || echo "release delete failed"
          else
            echo "no existing release for $tag"
          fi

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: packages/*.dll
          generate_release_notes: true
          fail_on_unmatched_files: true
