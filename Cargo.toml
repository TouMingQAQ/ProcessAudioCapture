[package]
name = "process_audio_capture"
version = "0.2.0"
edition = "2021"
description = "Capture the audio a Windows process renders, exposed through a C ABI DLL"
license = "MIT"

[lib]
name = "ProcessAudioCapture"
crate-type = ["cdylib", "rlib"]

[dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Media_Multimedia",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Threading",
    "Win32_System_Variant",
] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
